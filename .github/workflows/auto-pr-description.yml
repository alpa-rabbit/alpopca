name: Auto PR Description

on:
  pull_request:
    types: [opened]

jobs:
  describe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Description
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            이 PR의 diff를 분석해서 PR 본문을 작성해주세요.

            ## 형식

            아래 형식을 정확히 따라주세요:

            ## 작업 유형
            - [x] 해당하는 유형 하나만 체크 (🚀 기능 추가 / 🐛 버그 수정 / ♻️ 리팩토링 / 🔥 핫픽스)
            - [ ] 나머지는 빈 체크박스

            ## 변경 사항
            - 변경된 내용을 bullet으로 간결하게 나열

            ## 규칙
            - 한국어로 작성
            - 변경 사항은 3~5개 이내로 핵심만
            - 커밋 메시지를 그대로 복사하지 말고, 리뷰어가 이해하기 쉽게 요약
            - 불필요한 설명이나 인사말 없이 바로 본문만 출력

          update_description: true
